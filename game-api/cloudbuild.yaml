# Google Cloud Build ile imaj oluşturma + Cloud Run dağıtımı.
# Kullanım:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_REPO=cloud-run-source-deploy
#
# Sırlar Secret Manager'dan gelir (bkz. README "Secret Manager" bölümü);
# ortam değişkenleri burada düz metin olarak tutulmaz.

substitutions:
  _REGION: europe-west1
  _REPO: cloud-run-source-deploy
  _SERVICE: game-api
  _SUPABASE_URL: https://<proje-ref>.supabase.co

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=256Mi
      - --concurrency=80
      - --min-instances=0
      - --max-instances=4
      - --timeout=30
      - --set-env-vars=NODE_ENV=production,SUPABASE_URL=${_SUPABASE_URL},SUPABASE_SCHEMA=public,SUPABASE_JWT_AUDIENCE=authenticated,AUTH_MODE=both,ROLE_LOOKUP_ENABLED=true,ROOMS_TABLE=rooms
      - --set-secrets=SUPABASE_SERVICE_ROLE_KEY=game-api-supabase-key:latest,SUPABASE_JWT_SECRET=game-api-jwt-secret:latest,GAME_API_KEY=game-api-service-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY