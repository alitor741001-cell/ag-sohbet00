<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-ag-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Yazı tipi önden bağlantıyla alınır: CSS içindeki @import zinciri açılışı bekletmez. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Süs yazı tipi ilk boyamayı bekletmez: CSS yüklendikten sonra devreye girer. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" /></noscript>
    <!-- Güvenlik header'ları -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0d0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FILMKEYFİ" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-ag.png" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self), geolocation=()" />
    <title>AG</title>
    <!-- Açılışta, stiller ve içerik hazırlanmadan önce de sayfa zemini koyu kalır:
         ekranın üstünde beyaz bir şerit görünmez. -->
    <style>html, body { background-color: #0d0a0a; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
